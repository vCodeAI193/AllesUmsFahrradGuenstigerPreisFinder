<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Alle günstigen Preise und Angebote rund ums Fahrrad an einem Ort finden – Preisvergleich, Deals und Preisalarme." />
  <title>Alles ums Fahrrad – Günstiger-Preis-Finder</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚲%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo" data-link>🚲 <span>Günstiger-Preis-Finder</span></a>

      <form id="search-form" class="search" role="search" autocomplete="off">
        <input id="search-input" type="search" name="q" placeholder="Fahrrad, Marke, Teil oder EAN suchen …"
               aria-label="Suche" />
        <button type="submit" aria-label="Suchen">🔍</button>
        <ul id="suggestions" class="suggestions" hidden></ul>
      </form>

      <nav class="main-nav">
        <a href="#/deals" data-link>Deals</a>
        <a href="#/haendler" data-link>Händler</a>
        <a href="#/wishlist" data-link>Merkliste <span id="wishlist-badge" class="badge" hidden>0</span></a>
        <a href="#/alerts" data-link>Preisalarme</a>
        <button id="theme-toggle" class="icon-btn" aria-label="Dark Mode umschalten" title="Dark Mode">🌙</button>
      </nav>
    </div>
  </header>

  <main id="app" class="container" aria-live="polite">
    <!-- Views are rendered here by app.js -->
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        <strong>Alles ums Fahrrad – Günstiger-Preis-Finder.</strong>
        Prototyp mit synthetischen Beispieldaten. Preise & Verfügbarkeiten sind nicht real.
      </p>
      <form id="newsletter-form" class="newsletter">
        <label for="newsletter-email">📬 Die besten Wochen-Deals per Newsletter:</label>
        <span class="newsletter-row">
          <input id="newsletter-email" type="email" placeholder="deine@email.de" aria-label="E-Mail für Newsletter" required />
          <button class="btn" type="submit">Abonnieren</button>
        </span>
        <span id="newsletter-feedback" class="muted"></span>
      </form>
      <p class="muted">
        <a href="#/faq" data-link>FAQ &amp; Glossar</a> ·
        <a href="#/haendler" data-link>Händler</a> ·
        <a href="/api/export" download>Meine Daten exportieren</a>
      </p>
      <p id="meta-line" class="muted"></p>
    </div>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
